<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="bgWall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e5e5e2"/>
      <stop offset="100%" stop-color="#9e9e99"/>
    </linearGradient>
    <linearGradient id="deepShadow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#090909"/>
      <stop offset="100%" stop-color="#1e1e1d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bgWall)"/>
  <!-- Stark Diagonal Chiaroscuro Shadow -->
  <polygon points="0,0 740,0 320,900 0,900" fill="url(#deepShadow)"/>
  <polygon points="740,0 1200,0 1200,320 560,900 320,900" fill="#c7c7c2"/>
  <!-- Architectural Archway & Monolith -->
  <rect x="640" y="140" width="380" height="620" fill="#141413"/>
  <path d="M 690 760 L 690 360 A 140 140 0 0 1 970 360 L 970 760 Z" fill="#dcdcd7"/>
  <!-- Solitary Human Silhouette in Minimalist Coat -->
  <circle cx="830" cy="495" r="22" fill="#0d0d0d"/>
  <polygon points="795,525 865,525 885,715 775,715" fill="#0d0d0d"/>
  <rect x="808" y="715" width="14" height="55" fill="#0d0d0d"/>
  <rect x="838" y="715" width="14" height="55" fill="#0d0d0d"/>
  <!-- Long Cast Shadow -->
  <polygon points="775,760 885,760 540,900 390,900" fill="#090909" opacity="0.82"/>
</svg>
