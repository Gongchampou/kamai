<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="monoSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#262626"/>
    </linearGradient>
    <linearGradient id="marbleSlope" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f4f6"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#monoSky)"/>
  <!-- Angular White Marble Roof Planes (Oslo Opera Inspired) -->
  <polygon points="0,680 1200,260 1200,720 0,720" fill="url(#marbleSlope)"/>
  <polygon points="0,510 820,680 0,680" fill="#52525b"/>
  <!-- Glass Curtain Wall Facade -->
  <polygon points="340,561 980,337 980,590 340,650" fill="#18181b"/>
  <g stroke="#71717a" stroke-width="2" opacity="0.6">
    <line x1="420" y1="533" x2="420" y2="642"/>
    <line x1="500" y1="505" x2="500" y2="635"/>
    <line x1="580" y1="477" x2="580" y2="627"/>
    <line x1="660" y1="449" x2="660" y2="620"/>
    <line x1="740" y1="421" x2="740" y2="612"/>
    <line x1="820" y1="393" x2="820" y2="605"/>
    <line x1="900" y1="365" x2="900" y2="597"/>
  </g>
  <!-- Dark Fjord Foreground -->
  <rect y="680" width="1200" height="220" fill="#09090b"/>
  <polygon points="340,680 1200,680 1200,820 480,820" fill="#ffffff" opacity="0.08"/>
</svg>
